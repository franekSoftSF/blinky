# Where the reference PKCS#11 module keeps its token.
#
# Mounted read-only; the directory it names is a volume, and that volume is the
# thing to back up. Losing it is losing the management-key master and the PUK
# key-encryption key at once, and neither is recoverable from anywhere else -
# see docs/06-security.md.
#
# Nothing in Blinky reads this file. The module does, and only because it was
# told to by SOFTHSM2_CONF. A deployment on a real device deletes both.
directories.tokendir = /var/lib/blinky/tokens/
objectstore.backend = file
log.level = ERROR
