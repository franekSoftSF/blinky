name: blinky

services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Published so the schema tool and psql can reach it from the host. The
      # API is deliberately not published; the database is, because inspecting
      # it is half of debugging.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blinky}
      POSTGRES_USER: ${POSTGRES_USER:-blinky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blinky}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only against an empty data directory. Changing the schema means
      # `docker compose down -v` or a hand-written ALTER.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blinky}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROJECT: src/Blinky.Api/Blinky.Api.csproj
        ASSEMBLY: Blinky.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Blinky: Host=postgres;Database=${POSTGRES_DB:-blinky};Username=${POSTGRES_USER:-blinky};Password=${POSTGRES_PASSWORD:-blinky}
      Blinky__Enrolment__BootstrapToken: ${BOOTSTRAP_TOKEN:-change-me-before-anyone-else-can-reach-this}
      Blinky__Operator__Token: ${OPERATOR_TOKEN:-change-me-too}
      Blinky__AgentCa__CertificatePath: /etc/blinky/certs/agent-ca.crt
      Blinky__AgentCa__KeyPath: /etc/blinky/certs/agent-ca.key
      Blinky__Ca__Directory: /etc/blinky/ca

      # The directory people are read out of. Unset, the endpoints answer
      # "no directory is configured" and cardholders are entered by hand,
      # which is a normal way to run this.
      #
      # Read-only by design: nothing writes to the directory, so the account
      # this binds as needs nothing but read. Leave BindDn empty to bind with
      # Kerberos from the container's own credentials instead, which is better
      # where it is possible - no password anywhere.
      Blinky__Directory__Host: ${DIRECTORY_HOST:-}
      # 636, not 389. LDAPS establishes encryption before the first message;
      # StartTLS on 389 starts in the clear and upgrades, and that upgrade is
      # not implemented in System.DirectoryServices.Protocols on Linux - it
      # returns "the LDAP server is unavailable" in zero milliseconds, without
      # sending a packet, while ldapwhoami against the same host with the same
      # credentials binds perfectly. Samba answers on both with the same
      # certificate, so this costs nothing.
      Blinky__Directory__Port: ${DIRECTORY_PORT:-636}
      Blinky__Directory__BaseDn: ${DIRECTORY_BASE_DN:-}
      Blinky__Directory__Source: ${DIRECTORY_SOURCE:-Samba4}
      Blinky__Directory__BindDn: ${DIRECTORY_BIND_DN:-}
      Blinky__Directory__BindPassword: ${DIRECTORY_BIND_PASSWORD:-}
      Blinky__Directory__UseTls: ${DIRECTORY_USE_TLS:-true}

      # What the LDAP client verifies the directory's certificate against.
      #
      # On Linux, System.DirectoryServices.Protocols is OpenLDAP underneath,
      # and OpenLDAP takes its trust from here or from /etc/ldap/ldap.conf -
      # not from the .NET trust store, and not from any option on the
      # connection object. Without it, StartTLS against a directory whose
      # certificate this container cannot verify fails as "The LDAP server is
      # unavailable": a message about reachability for a question of trust,
      # returned in twenty milliseconds with the port wide open the whole time.
      #
      # Points at the CA this installation already mounts. A directory holding
      # a certificate from somewhere else needs that anchor mounted and this
      # pointed at it instead.
      LDAPTLS_CACERT: ${LDAPTLS_CACERT:-/etc/blinky/ca/chain.pem}

      # The address written into every certificate as its CRL distribution
      # point and authority information access. Has to be one the relying
      # party can reach - not localhost, not a container name - and HTTP
      # rather than HTTPS. Unset, certificates are issued without either
      # extension and Windows refuses the logon with
      # CERT_TRUST_REVOCATION_STATUS_UNKNOWN.
      Blinky__Ca__PublicUrl: ${CA_PUBLIC_URL:-}

      # Where the CRL is also written, as DER. Samba publishes it into the
      # directory as bytes and PKINIT reads it from disk; neither fetches a
      # URL.
      Blinky__Ca__CrlFile: /var/lib/blinky/pki/issuing.crl
      Blinky__Ca__Password: ${CA_PASSWORD:-blinky}
      # Development material. A file-backed CA key refuses to load without this
      # said out loud, because nobody ever decides to use one - they inherit it.
      Blinky__Ca__AllowFileKeys: "true"
      # Escrowed PUKs are encrypted with this. The API refuses to start without
      # it rather than inventing one: a key generated at startup would encrypt
      # this run's PUKs with a value that dies with the process, and every token
      # unblocked today would be unrecoverable tomorrow.
      Blinky__Puk__Kek: ${PUK_KEK}
    volumes:
      # The agent CA signs the certificates agents authenticate with. Dev
      # material from scripts/dev-certs.sh; in production this is the one thing
      # here that belongs behind a key store.
      - ./certs:/etc/blinky/certs:ro
      - ./ca:/etc/blinky/ca:ro

      # Writable, and on the host on purpose: scripts/blinky-samba-setup.sh
      # publishes this file into the directory, and it has to be readable by
      # something that is not this container.
      - ./pki:/var/lib/blinky/pki
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  worker:
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROJECT: src/Blinky.Worker/Blinky.Worker.csproj
        ASSEMBLY: Blinky.Worker
    environment:
      ConnectionStrings__Blinky: Host=postgres;Database=${POSTGRES_DB:-blinky};Username=${POSTGRES_USER:-blinky};Password=${POSTGRES_PASSWORD:-blinky}

      # The worker builds the revocation list; the API only serves the file it
      # writes. One producer, so there is one list - the store behind it is
      # per-process, and two processes each building their own would publish
      # two different answers to the same question.
      Blinky__Ca__Directory: /etc/blinky/ca
      Blinky__Ca__Password: ${CA_PASSWORD:-blinky}
      Blinky__Ca__AllowFileKeys: "true"
      Blinky__Ca__CrlFile: /var/lib/blinky/pki/issuing.crl
      Blinky__Ca__CrlValidityHours: ${CRL_VALIDITY_HOURS:-8}
      Blinky__Ca__CrlRefreshHours: ${CRL_REFRESH_HOURS:-2}
    volumes:
      - ./ca:/etc/blinky/ca:ro
      - ./pki:/var/lib/blinky/pki
    depends_on:
      postgres:
        condition: service_healthy
    # Single replica by design - it owns the work that must happen exactly once.
    deploy:
      replicas: 1

  # The console: built from frontend/ and served as static files. Behind the
  # edge rather than on a port of its own, so the browser sees one origin for
  # the page and the API both - no CORS, one certificate, and the rule set in
  # front of everything.
  console:
    build:
      context: ./frontend
    restart: unless-stopped

  edge:
    image: owasp/modsecurity-crs:nginx
    ports:
      # Plain HTTP, for the CRL and the CA certificate only. See the pki
      # server block in docker/edge: a client fetching revocation cannot be
      # asked to validate a certificate first.
      - "${PKI_PORT:-80}:80"
      - "${CONSOLE_PORT:-8443}:8443"
      - "${AGENT_PORT:-9443}:9443"
    environment:
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      MODSEC_REQ_BODY_LIMIT: "13107200"
    volumes:
      - ./docker/edge/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

      # nginx resolves upstream names once at start. Without this the edge can
      # come up before the console exists and refuse to start at all, with an
      # error about a host that is merely late.
      - console

volumes:
  postgres-data:
