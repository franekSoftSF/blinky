name: blinky

services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Published so the schema tool and psql can reach it from the host. The
      # API is deliberately not published; the database is, because inspecting
      # it is half of debugging.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blinky}
      POSTGRES_USER: ${POSTGRES_USER:-blinky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blinky}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only against an empty data directory. Changing the schema means
      # `docker compose down -v` or a hand-written ALTER.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blinky}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROJECT: src/Blinky.Api/Blinky.Api.csproj
        ASSEMBLY: Blinky.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Blinky: Host=postgres;Database=${POSTGRES_DB:-blinky};Username=${POSTGRES_USER:-blinky};Password=${POSTGRES_PASSWORD:-blinky}
      Blinky__Enrolment__BootstrapToken: ${BOOTSTRAP_TOKEN:-change-me-before-anyone-else-can-reach-this}
      Blinky__Operator__Token: ${OPERATOR_TOKEN:-change-me-too}
      Blinky__AgentCa__CertificatePath: /etc/blinky/certs/agent-ca.crt
      Blinky__AgentCa__KeyPath: /etc/blinky/certs/agent-ca.key
      Blinky__Ca__Directory: /etc/blinky/ca
      Blinky__Ca__Password: ${CA_PASSWORD:-blinky}
      # Development material. A file-backed CA key refuses to load without this
      # said out loud, because nobody ever decides to use one - they inherit it.
      Blinky__Ca__AllowFileKeys: "true"
      # Escrowed PUKs are encrypted with this. The API refuses to start without
      # it rather than inventing one: a key generated at startup would encrypt
      # this run's PUKs with a value that dies with the process, and every token
      # unblocked today would be unrecoverable tomorrow.
      Blinky__Puk__Kek: ${PUK_KEK}
    volumes:
      # The agent CA signs the certificates agents authenticate with. Dev
      # material from scripts/dev-certs.sh; in production this is the one thing
      # here that belongs behind a key store.
      - ./certs:/etc/blinky/certs:ro
      - ./ca:/etc/blinky/ca:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  worker:
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROJECT: src/Blinky.Worker/Blinky.Worker.csproj
        ASSEMBLY: Blinky.Worker
    environment:
      ConnectionStrings__Blinky: Host=postgres;Database=${POSTGRES_DB:-blinky};Username=${POSTGRES_USER:-blinky};Password=${POSTGRES_PASSWORD:-blinky}
    depends_on:
      postgres:
        condition: service_healthy
    # Single replica by design - it owns the work that must happen exactly once.
    deploy:
      replicas: 1

  # The console: built from frontend/ and served as static files. Behind the
  # edge rather than on a port of its own, so the browser sees one origin for
  # the page and the API both - no CORS, one certificate, and the rule set in
  # front of everything.
  console:
    build:
      context: ./frontend
    restart: unless-stopped

  edge:
    image: owasp/modsecurity-crs:nginx
    ports:
      - "${CONSOLE_PORT:-8443}:8443"
      - "${AGENT_PORT:-9443}:9443"
    environment:
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      MODSEC_REQ_BODY_LIMIT: "13107200"
    volumes:
      - ./docker/edge/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

      # nginx resolves upstream names once at start. Without this the edge can
      # come up before the console exists and refuse to start at all, with an
      # error about a host that is merely late.
      - console

volumes:
  postgres-data:
