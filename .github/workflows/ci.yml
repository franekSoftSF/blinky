name: ci

# windows-latest, not ubuntu: Blinky.Agent.Ui is WPF and Blinky.AdcsConnector
# targets net10.0-windows for DCOM. The containerised projects build fine on
# Linux, but the solution as a whole does not.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Blinky.slnx

      - name: Build
        run: dotnet build Blinky.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Blinky.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
