<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Blinky CMS</title>
  <!--
    The mark for 16-48 px: no arc, no nodes, no glow, no gradients - at that
    size they turn into a cyan smudge. The key, the hole and the sensor stay,
    because those are what make it a key. Same reasoning, same shapes as
    BlinkyLite's favicon; the colours are this console's.
  -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#08121F" stroke="#18C9DF" stroke-width="2"/>
  <g transform="rotate(35 32 32)">
    <rect x="26.5" y="41" width="11" height="12" rx="1.5" fill="#E0AE3E"/>
    <rect x="20" y="9" width="24" height="34" rx="6" fill="#132135" stroke="#5AE3F3" stroke-width="3"/>
    <circle cx="32" cy="16.5" r="3" fill="#18C9DF"/>
    <circle cx="32" cy="30" r="6" fill="none" stroke="#18C9DF" stroke-width="3"/>
  </g>
</svg>
